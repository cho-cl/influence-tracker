# Influence Tracker watchlist. Edit freely; handles are checked on the next run and
# `influence status` lists any that fail to resolve.
#
# Account categories: politician | investor | short_seller | exec | influencer | media

x:
  monthly_budget_usd: 10.0
  cost_per_post_read_usd: 0.005
  cost_per_user_read_usd: 0.010
  # Day of the month your X billing cycle resets (see the X developer console).
  billing_cycle_day: 1
  accounts:
    - { handle: elonmusk, category: exec }
    - { handle: jimcramer, category: media }
    - { handle: CathieDWood, category: investor }
    - { handle: BillAckman, category: investor }
    - { handle: chamath, category: investor }
    - { handle: michaeljburry, category: investor }
    - { handle: TheRoaringKitty, category: influencer }
    - { handle: saylor, category: exec }
    - { handle: brian_armstrong, category: exec }
    - { handle: muddywatersre, category: short_seller }
    - { handle: CitronResearch, category: short_seller }
    - { handle: realDonaldTrump, category: politician }
    - { handle: WhiteHouse, category: politician }
    - { handle: JDVance, category: politician }
    - { handle: SecScottBessent, category: politician }
    - { handle: howardlutnick, category: politician }
    - { handle: DavidSacks, category: politician }

truthsocial:
  # Truth Social rate-limits bursts (Cloudflare 429 / error 1015). Keep this >= 5.
  min_request_interval_s: 5.0
  first_run_days: 30
  accounts:
    - { handle: realDonaldTrump, category: politician }
    - { handle: JDVance1, category: politician }
    - { handle: WhiteHouse, category: politician }
    - { handle: PressSec, category: politician }
    - { handle: DonaldJTrumpJr, category: influencer }
    - { handle: EricTrump, category: exec }
    - { handle: DevinNunes, category: exec }

reddit:
  subreddits: [wallstreetbets, stocks, investing, StockMarket, options]
  rss_limit: 100

apewisdom:
  filters: [all-stocks, wallstreetbets]
  pages: 3

prices:
  # Yahoo keeps 1-minute bars for 30 days; stay a day inside that.
  backfill_days: 29
  request_pause_s: 1.0

# Uppercase words that are also tickers but usually mean something else. Bare (no $)
# ticker matching only runs on Reddit, and skips these.
bare_ticker_stoplist: [CAT, ARM, COST, SHOP, SPOT, SNAP, HOOD, COIN, MAT, PEP, XYZ, DIS]

# names:            matched case-insensitively on word boundaries.
# ambiguous_names:  must be capitalized AND appear with a finance word (stock, shares, buy, ...).
# aliases:          other symbols that mean the same company ($GOOG -> GOOGL).
# benchmark:        market proxies; never analyzed as events.
tickers:
  - { symbol: SPY, benchmark: true }
  - { symbol: QQQ, benchmark: true }

  # Mega-cap tech
  - { symbol: AAPL, ambiguous_names: [Apple] }
  - { symbol: MSFT, names: [Microsoft] }
  - { symbol: NVDA, names: [Nvidia] }
  - { symbol: AMZN, ambiguous_names: [Amazon] }
  - { symbol: GOOGL, names: [Google], ambiguous_names: [Alphabet], aliases: [GOOG] }
  - { symbol: META, names: [Facebook], ambiguous_names: [Meta], aliases: [FB] }
  - { symbol: TSLA, names: [Tesla] }
  - { symbol: NFLX, names: [Netflix] }

  # Semis / AI / software
  - { symbol: AMD, names: [AMD] }
  - { symbol: INTC, ambiguous_names: [Intel] }
  - { symbol: AVGO, names: [Broadcom] }
  - { symbol: TSM, names: [TSMC, Taiwan Semiconductor] }
  - { symbol: MU, ambiguous_names: [Micron] }
  - { symbol: ARM, names: [Arm Holdings] }
  - { symbol: SMCI, names: [Supermicro, Super Micro] }
  - { symbol: PLTR, names: [Palantir] }
  - { symbol: ORCL, ambiguous_names: [Oracle] }
  - { symbol: CRM, names: [Salesforce] }
  - { symbol: ADBE, names: [Adobe] }
  - { symbol: IBM, names: [IBM] }
  - { symbol: QCOM, names: [Qualcomm] }
  - { symbol: CRWV, names: [CoreWeave] }

  # Retail / meme / fintech / crypto-adjacent
